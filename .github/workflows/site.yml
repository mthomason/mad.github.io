name: Site checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  site:
    name: site checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/checkout@v7
        with:
          repository: mthomason/MAD
          path: MAD

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Install Jekyll and the plugins
        run: gem install jekyll jekyll-seo-tag jekyll-sitemap

      - name: Build the site
        run: jekyll build -d _site

      - name: Run the checker tests
        run: python3 -I scripts/check_site_test.py

      - name: Check the built site
        run: python3 -I scripts/check_site.py

      - name: Check the cross-repository facts
        run: python3 -I MAD/scripts/docs/check_site_facts.py --docs MAD/docs --marketing .
