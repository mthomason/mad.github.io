	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="theme-color" content="#0AA0D5">
	<meta name="author" content="Everyday Apps LLC">
	<meta name="publisher" content="Everyday Apps LLC">
	{% seo %}
	<link rel="alternate" hreflang="en" href="{{ en_url | absolute_url }}">
	<link rel="alternate" hreflang="zh-CN" href="{{ chinese_url | absolute_url }}">
	<link rel="alternate" hreflang="ja-JP" href="{{ japanese_url | absolute_url }}">
	<link rel="alternate" hreflang="pt-BR" href="{{ portuguese_url | absolute_url }}">
	<link rel="alternate" hreflang="de-DE" href="{{ german_url | absolute_url }}">
	<link rel="alternate" hreflang="es-419" href="{{ spanish_url | absolute_url }}">
	<link rel="alternate" hreflang="es" href="{{ spanish_url | absolute_url }}">
	<link rel="alternate" hreflang="x-default" href="{{ en_url | absolute_url }}">
	{% if page.keywords %}<meta name="keywords" content="{{ page.keywords }}">{% endif %}

	<link rel="preload" href="{{ '/css/style.css' | relative_url }}" as="style">
	<link rel="stylesheet" href="{{ '/css/style.css' | relative_url }}">
	<link rel="icon" href="{{ '/img/favicon.svg' | relative_url }}" type="image/svg+xml">
	<link rel="mask-icon" href="{{ '/img/mask-icon.svg' | relative_url }}" color="#dc2448">
	<link rel="icon" type="image/png" sizes="96x96" href="{{ '/img/favicon-96x96.png' | relative_url }}">
	<link rel="icon" type="image/png" sizes="48x48" href="{{ '/img/favicon-48x48.png' | relative_url }}">
	<link rel="icon" type="image/png" sizes="32x32" href="{{ '/img/favicon-32x32.png' | relative_url }}">
	<link rel="icon" type="image/png" sizes="16x16" href="{{ '/img/favicon-16x16.png' | relative_url }}">
	<link rel="apple-touch-icon" sizes="180x180" href="{{ '/img/apple-touch-icon.png' | relative_url }}">
	<link rel="shortcut icon" href="{{ '/img/favicon.ico' | relative_url }}">
	<link rel="manifest" href="{{ '/site.webmanifest' | relative_url }}">

	<script type="application/ld+json">
	{
		"@context": "https://schema.org",
		"@type": "SoftwareApplication",
		"name": "MAD Designer",
		"operatingSystem": ["iOS", "macOS", "Windows"],
		"applicationCategory": "BusinessApplication",
		"softwareVersion": "{{ site.data.versions.macos_app_version }}",
		"description": {{ page.description | default: site.description | jsonify }},
		"url": {{ site.url | append: "/" | jsonify }},
		"image": {{ site.url | append: "/img/mad-designer-icon-1024.png" | jsonify }},
		"publisher": {
			"@type": "Organization",
			"name": "Everyday Apps LLC"
		}
	}
	</script>
